{% extends "index.html" %}

{% block contenido %}
<section class="recent-section">
    <div class="section-header">
        <h2>Crear Nuevo Empleado</h2>
    </div>

    <form method="post" class="neon-form"
        style="max-width: 500px; margin: 0 auto; background: var(--glass-bg); padding: 30px; border-radius: 15px;">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Nombre de Usuario</label>
            <input type="text" name="username" required
                style="width: 100%; padding: 10px; border-radius: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--neon-blue);">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Contraseña</label>
            <input type="password" name="password" required
                style="width: 100%; padding: 10px; border-radius: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--neon-blue);">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Email</label>
            <input type="email" name="email" required
                style="width: 100%; padding: 10px; border-radius: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--neon-blue);">
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
            <label>Rol / Grupo</label>
            <select name="grupo" required
                style="width: 100%; padding: 10px; border-radius: 5px; background: #222; color: white; border: 1px solid var(--neon-blue);">
                {% for grupo in grupos %}
                <option value="{{ grupo.id }}">{{ grupo.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn-add" style="width: 100%;">Crear Empleado</button>
    </form>
</section>
{% endblock %}
