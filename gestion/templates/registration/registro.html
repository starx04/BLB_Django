{% extends 'index.html' %}

{% block contenido %}
<h2>Registro de usuario</h2>
<p>Al registrarte serás asignado automáticamente como <strong>Cliente</strong> y se te redirigirá a tu tablero de cliente.</p>
<form method="post">
    {{ form.non_field_errors }}
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-primary">Registrarse</button>
</form>
{% endblock %}
